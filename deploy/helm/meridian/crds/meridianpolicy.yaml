# MeridianPolicy CRD (CP-5 / Phase 7).
# Schema mirrors internal/control/k8s/crd.go — keep the two in sync.
# Helm installs files under crds/ before templates (no templating allowed here).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: meridianpolicies.meridian.io
spec:
  group: meridian.io
  scope: Namespaced
  names:
    kind: MeridianPolicy
    listKind: MeridianPolicyList
    plural: meridianpolicies
    singular: meridianpolicy
    shortNames:
      - mpol
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["selector", "sources", "ports", "action"]
              properties:
                selector:
                  type: object
                  required: ["namespace"]
                  properties:
                    namespace:
                      type: string
                      minLength: 1
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                sources:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items:
                    type: string
                    pattern: "^spiffe://.+"
                ports:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items:
                    type: integer
                    minimum: 1
                    maximum: 65535
                protocols:
                  type: array
                  maxItems: 2
                  items:
                    type: string
                    enum: ["tcp", "udp"]
                action:
                  type: string
                  enum: ["allow", "deny"]
      additionalPrinterColumns:
        - name: Action
          type: string
          jsonPath: .spec.action
        - name: Namespace-Selector
          type: string
          jsonPath: .spec.selector.namespace
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
