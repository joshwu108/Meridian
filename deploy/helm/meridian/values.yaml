## Meridian Helm chart values.
## Override in your values file or with --set.

## Control plane deployment
control:
  image:
    ## Placeholder. Meridian publishes no public images, so you MUST override
    ## this with a repository your cluster can pull from:
    ##   --set control.image.repository=<registry>/meridian-control
    ## For a kind cluster, `make docker-build && kind load docker-image
    ## meridian-control:dev` makes the bare default resolvable on the node —
    ## pair it with pullPolicy: Never so the kubelet does not try the registry.
    repository: meridian-control
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  listenAddr: ":8080"
  adsAddr: ":9443"
  ## Admission webhook listens on 9444 — distinct from adsAddr (9443) so the
  ## webhook and the ADS gRPC server can bind simultaneously.
  webhookAddr: ":9444"
  trustDomain: "cluster.local"
  standalone: true
  service:
    type: ClusterIP
    restPort: 8080
    adsPort: 9443
    webhookPort: 9444
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

## Agent DaemonSet
agent:
  image:
    ## Placeholder — see control.image.repository. Override with:
    ##   --set agent.image.repository=<registry>/meridian-agent
    repository: meridian-agent
    tag: dev
    pullPolicy: IfNotPresent
  standalone: false
  ## ADS gRPC address of the control plane. REQUIRED for the agent to receive
  ## identities and compiled policy — with this empty the agent loads its eBPF
  ## programs and enforces, but its identity/policy maps stay empty and every
  ## flow is denied (fail-closed). Empty = ADS disabled.
  adsAddr: ""
  ## Host-side pod veth name prefix for automatic TC attach. The default "lxc"
  ## is the Cilium convention; it matches NOTHING on a kind/kindnet node, where
  ## host-side veths are named veth<hex>. See also `iface`.
  ##
  ## DANGER: a broad prefix attaches to EVERY matching pod veth as it appears.
  ## Because enforcement is fail-closed, any pod whose identity is not yet in
  ## identity_map has its traffic dropped — on a cluster with no seeded
  ## identities this takes out CoreDNS and anything else on the node. Seed
  ## identities/policy first, or scope the attach with `iface`.
  vethPrefix: "lxc"
  ## Attach to exactly one named interface instead of a prefix watcher. Safer
  ## than vethPrefix for demos and incremental rollout. Empty = disabled.
  iface: ""
  ## Mount bpffs at /sys/fs/bpf via a privileged initContainer when it is not
  ## already a bpf mount. Required on nodes that do not pre-mount it (kind does
  ## not); harmless and idempotent where it is already mounted. The agent pins
  ## its maps under pinDir, which MUST be on a real bpffs — without this the
  ## hostPath DirectoryOrCreate silently makes a plain directory and map
  ## pinning fails.
  mountBpffs: true
  ## Remove a stale Workload API socket from the /run/meridian hostPath before
  ## the agent starts. The socket outlives the pod (hostPath, not emptyDir), so
  ## after an ungraceful stop the next agent fails to bind an address that is
  ## already in use and crashloops. Only the socket is removed — the node
  ## bootstrap credential next to it is deliberately preserved so token
  ## bootstrap still reuses it across restarts.
  cleanStaleSocket: true
  ## Image for the mount-bpffs and clean-workload-socket initContainers. The
  ## agent image is distroless and has neither mount(8) nor rm(1).
  initImage: "busybox:1.37"
  pinDir: "/sys/fs/bpf/meridian"
  workloadAPISocket: "/run/meridian/workload.sock"
  proxyInboundPort: 15008
  proxyOutboundPort: 15001
  adminAddr: "127.0.0.1:9902"
  metricsPort: 9901
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  # hostNetwork: false  -- agent uses host netns for TPROXY rules
  hostPID: false

## Validating admission webhook for MeridianPolicy
## caBundle: base64-encoded PEM bundle the apiserver uses to verify the
## webhook's serving certificate — set by the deployer (e.g. cert-manager
## CA injection or manual --set webhook.caBundle=$(base64 < ca.crt)).
webhook:
  enabled: false
  caBundle: ""
  ## Name of an existing kubernetes.io/tls Secret holding the webhook's serving
  ## certificate, under the standard tls.crt / tls.key keys. REQUIRED when
  ## enabled: true — rendering fails without it. Create it with cert-manager
  ## (a Certificate whose secretName matches this) or by hand:
  ##   kubectl create secret tls meridian-webhook-certs --cert=tls.crt --key=tls.key
  certSecret: ""
  ## Mount path for certSecret inside the control-plane container. The
  ## --webhook-cert / --webhook-key flags are derived from this.
  certDir: /etc/meridian/webhook-certs
  ## Extra annotations for the ValidatingWebhookConfiguration. Use this for
  ## cert-manager CA injection instead of setting caBundle by hand, e.g.
  ##   cert-manager.io/inject-ca-from: <namespace>/<certificate-name>
  annotations: {}

## RBAC for K8s pod/service informers
rbac:
  create: true

## ServiceAccount for agent TokenReview bootstrap
serviceAccount:
  create: true
  name: meridian-agent
