apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "meridian.fullname" . }}-agent
  labels:
    app.kubernetes.io/component: agent
    {{- include "meridian.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "meridian.componentSelectorLabels" (dict "root" . "component" "agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meridian.componentSelectorLabels" (dict "root" . "component" "agent") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      hostNetwork: true
      # With hostNetwork the kubelet downgrades ClusterFirst to Default, which
      # gives the agent the NODE's resolv.conf. In-cluster service names then
      # fail to resolve and the ADS client dies with "produced zero addresses".
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: {{ .Values.agent.hostPID }}
      {{- if or .Values.agent.mountBpffs .Values.agent.cleanStaleSocket }}
      initContainers:
        {{- if .Values.agent.mountBpffs }}
        # Mount bpffs on the HOST (Bidirectional propagation) when absent.
        # Idempotent: a node that already has /sys/fs/bpf as type bpf is a
        # no-op. Needs its own image because the agent image is distroless and
        # has no mount(8).
        - name: mount-bpffs
          image: {{ .Values.agent.initImage }}
          command:
            - sh
            - -c
            - 'mountpoint -q /sys/fs/bpf || mount -t bpf bpf /sys/fs/bpf'
          securityContext:
            privileged: true
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
        {{- end }}
        {{- if .Values.agent.cleanStaleSocket }}
        # /run/meridian is a hostPath, so the Workload API socket survives the
        # pod. An ungraceful stop leaves the inode behind and the next agent
        # dies binding an already-in-use address. Remove ONLY the socket: the
        # node bootstrap cert/key live in the same directory and are
        # deliberately reused across restarts.
        - name: clean-workload-socket
          image: {{ .Values.agent.initImage }}
          command:
            - sh
            - -c
            - 'rm -f {{ .Values.agent.workloadAPISocket }}'
          volumeMounts:
            - name: workload-socket-dir
              mountPath: /run/meridian
        {{- end }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
          args:
            - --pin-dir={{ .Values.agent.pinDir }}
            {{- if .Values.agent.iface }}
            - --iface={{ .Values.agent.iface }}
            {{- else }}
            - --veth-prefix={{ .Values.agent.vethPrefix }}
            {{- end }}
            - --workload-api-socket={{ .Values.agent.workloadAPISocket }}
            - --proxy-inbound-port={{ .Values.agent.proxyInboundPort }}
            - --proxy-outbound-port={{ .Values.agent.proxyOutboundPort }}
            - --admin-addr={{ .Values.agent.adminAddr }}
            - --control-addr=http://{{ include "meridian.fullname" . }}-control:{{ .Values.control.service.restPort }}
            {{- if .Values.agent.adsAddr }}
            - --ads-addr={{ .Values.agent.adsAddr }}
            {{- else }}
            - --ads-addr={{ include "meridian.fullname" . }}-control:{{ .Values.control.service.adsPort }}
            {{- end }}
            {{- if .Values.agent.standalone }}
            - --standalone
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.agent.metricsPort }}
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
            - name: cgroupfs
              mountPath: /sys/fs/cgroup
            - name: workload-socket-dir
              mountPath: /run/meridian
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cgroupfs
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: workload-socket-dir
          hostPath:
            path: /run/meridian
            type: DirectoryOrCreate
