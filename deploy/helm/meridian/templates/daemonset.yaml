apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "meridian.fullname" . }}-agent
  labels:
    app.kubernetes.io/component: agent
    {{- include "meridian.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian.name" . }}-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meridian.name" . }}-agent
        {{- include "meridian.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      hostNetwork: true
      hostPID: {{ .Values.agent.hostPID }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN
          args:
            - --pin-dir={{ .Values.agent.pinDir }}
            - --veth-prefix={{ .Values.agent.vethPrefix }}
            - --workload-api-socket={{ .Values.agent.workloadAPISocket }}
            - --proxy-inbound-port={{ .Values.agent.proxyInboundPort }}
            - --proxy-outbound-port={{ .Values.agent.proxyOutboundPort }}
            - --admin-addr={{ .Values.agent.adminAddr }}
            - --control-addr=http://{{ include "meridian.fullname" . }}-control:{{ .Values.control.service.restPort }}
            {{- if .Values.agent.standalone }}
            - --standalone
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.agent.metricsPort }}
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: cgroupfs
              mountPath: /sys/fs/cgroup
            - name: workload-socket-dir
              mountPath: /run/meridian
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: cgroupfs
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: workload-socket-dir
          hostPath:
            path: /run/meridian
            type: DirectoryOrCreate
