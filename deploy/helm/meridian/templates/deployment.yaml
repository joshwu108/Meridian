apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}-control
  labels:
    app.kubernetes.io/component: control-plane
    {{- include "meridian.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.control.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian.name" . }}-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meridian.name" . }}-control
        {{- include "meridian.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: control
          image: "{{ .Values.control.image.repository }}:{{ .Values.control.image.tag }}"
          imagePullPolicy: {{ .Values.control.image.pullPolicy }}
          args:
            - --listen={{ .Values.control.listenAddr }}
            - --ads-addr={{ .Values.control.adsAddr }}
            - --trust-domain={{ .Values.control.trustDomain }}
            {{- if .Values.control.standalone }}
            - --standalone
            {{- end }}
          ports:
            - name: rest
              containerPort: 8080
            - name: ads-grpc
              containerPort: 9443
          resources:
            {{- toYaml .Values.control.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-control
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
spec:
  type: {{ .Values.control.service.type }}
  ports:
    - name: rest
      port: {{ .Values.control.service.restPort }}
      targetPort: rest
    - name: ads-grpc
      port: {{ .Values.control.service.adsPort }}
      targetPort: ads-grpc
  selector:
    app.kubernetes.io/name: {{ include "meridian.name" . }}-control
