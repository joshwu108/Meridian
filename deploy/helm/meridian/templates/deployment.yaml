apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}-control
  labels:
    app.kubernetes.io/component: control-plane
    {{- include "meridian.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.control.replicas }}
  selector:
    matchLabels:
      {{- include "meridian.componentSelectorLabels" (dict "root" . "component" "control") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meridian.componentSelectorLabels" (dict "root" . "component" "control") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "meridian.controlServiceAccountName" . }}
      containers:
        - name: control
          image: "{{ .Values.control.image.repository }}:{{ .Values.control.image.tag }}"
          imagePullPolicy: {{ .Values.control.image.pullPolicy }}
          args:
            - --listen={{ .Values.control.listenAddr }}
            - --ads-addr={{ .Values.control.adsAddr }}
            - --trust-domain={{ .Values.control.trustDomain }}
            {{- if .Values.control.kubeconfig }}
            - --kubeconfig={{ .Values.control.kubeconfig }}
            {{- end }}
            {{- if .Values.control.standalone }}
            - --standalone
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - --webhook-addr={{ .Values.control.webhookAddr }}
            - --webhook-cert={{ .Values.webhook.certDir }}/tls.crt
            - --webhook-key={{ .Values.webhook.certDir }}/tls.key
            {{- end }}
          ports:
            - name: rest
              containerPort: {{ .Values.control.listenAddr | splitList ":" | last | int }}
            - name: ads-grpc
              containerPort: {{ .Values.control.adsAddr | splitList ":" | last | int }}
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.control.webhookAddr | splitList ":" | last | int }}
            {{- end }}
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: webhook-certs
              mountPath: {{ .Values.webhook.certDir }}
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.control.resources | nindent 12 }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: webhook-certs
          secret:
            secretName: {{ include "meridian.webhookCertSecret" . }}
            defaultMode: 0400
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-control
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
spec:
  type: {{ .Values.control.service.type }}
  ports:
    - name: rest
      port: {{ .Values.control.service.restPort }}
      targetPort: rest
    - name: ads-grpc
      port: {{ .Values.control.service.adsPort }}
      targetPort: ads-grpc
    {{- if .Values.webhook.enabled }}
    - name: webhook
      port: {{ .Values.control.service.webhookPort }}
      targetPort: webhook
    {{- end }}
  selector:
    {{- include "meridian.componentSelectorLabels" (dict "root" . "component" "control") | nindent 4 }}
